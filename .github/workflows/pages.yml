name: Publicar el cuaderno en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar el generador
        run: python -m pip install -r requirements.txt
      - name: Construir las páginas con su URL pública
        run: python tools/build.py --url "${{ steps.pages.outputs.base_url }}" --output _site
      - name: Verificar enlaces, recursos y datos
        run: python tools/check_site.py _site
      - name: Preparar el sitio para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
